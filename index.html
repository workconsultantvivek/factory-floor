<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut"><meta name="theme-color" content="#16213a">
<script>window.FFR_API={url:"https://n8n.clothinco.in/webhook/factory-api"}</script>
<title>Factory Floor Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: phone-first app shell — navy header with tape strip, one work column (max 640px), fixed bottom tab bar, full-height sheets for pickers and forms */
:root{
  --bg:#EEF0F3; --surface:#FFFFFF; --sunk:#E4E7EC; --ink:#17223A; --muted:#5A6377; --line:#D5DAE3;
  --accent:#E2A417; --accent-ink:#221802; --btn:#17223A; --btn-ink:#FFFFFF; --head:#17223A; --head-ink:#EEF0F3;
  --ok:#1D7A4C; --ok-bg:#E1F2E8; --warn:#9A6200; --warn-bg:#FBF0D9; --bad:#B42318; --bad-bg:#FBE4E1;
  --display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
  --yel:#F6E3A1; --yel-ink:#5C4300; --grn:#CDEBD9; --grn-ink:#14573A; --gry:#DADDE3; --gry-ink:#6B7280;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#161F30; --sunk:#1D2839; --ink:#E6EBF3; --muted:#98A2B6; --line:#2A3650;
  --accent:#F0B43A; --accent-ink:#1E1502; --btn:#E6EBF3; --btn-ink:#0E1420; --head:#1B2538; --head-ink:#E6EBF3;
  --ok:#4CC38A; --ok-bg:#15301F; --warn:#E8AE4E; --warn-bg:#35280F; --bad:#F07A6E; --bad-bg:#3A1A18; --yel:#4A3B0E; --yel-ink:#F6D77A; --grn:#163826; --grn-ink:#8FE0B3; --gry:#262F40; --gry-ink:#8C95A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#161F30; --sunk:#1D2839; --ink:#E6EBF3; --muted:#98A2B6; --line:#2A3650;
  --accent:#F0B43A; --accent-ink:#1E1502; --btn:#E6EBF3; --btn-ink:#0E1420; --head:#1B2538; --head-ink:#E6EBF3;
  --ok:#4CC38A; --ok-bg:#15301F; --warn:#E8AE4E; --warn-bg:#35280F; --bad:#F07A6E; --bad-bg:#3A1A18; --yel:#4A3B0E; --yel-ink:#F6D77A; --grn:#163826; --grn-ink:#8FE0B3; --gry:#262F40; --gry-ink:#8C95A8; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html.offline body::before{pointer-events:none;content:'No connection – changes will not save until the internet is back';position:fixed;left:0;right:0;bottom:0;z-index:99;background:#b42318;color:#fff;font:600 .85rem/1.2 Barlow,system-ui,sans-serif;text-align:center;padding:8px 12px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:var(--head-ink)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-family:var(--display);font-size:1.3rem;font-weight:700;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{opacity:.75;font-size:.82rem}
.tape{height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 10px,var(--accent-ink) 10px 11px,var(--accent) 11px 20px,var(--accent-ink) 20px 22px)}
.ghost{background:transparent;border:1px solid color-mix(in srgb,var(--head-ink) 35%,transparent);color:var(--head-ink);border-radius:8px;padding:6px 10px;font-size:.85rem}
main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom .wrap{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding-inline:8px}
nav.bottom button{border:0;background:transparent;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.78rem;font-weight:600}
nav.bottom.many button{font-size:.68rem;padding-inline:0}
nav.bottom.many .ico{width:36px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current=true]{color:var(--ink)}
nav.bottom button[aria-current=true] .ico{background:var(--accent);color:var(--accent-ink)}
nav.bottom .ico{position:relative;}
.badge{position:absolute;top:-6px;right:-2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:.7rem;font-style:normal;font-weight:700;display:grid;place-items:center;line-height:1}
nav.bottom .ico{display:grid;place-items:center;width:44px;height:28px;border-radius:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.list{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lotno{font-family:var(--display);font-weight:700;letter-spacing:.02em}
.btn{border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);border-radius:10px;padding:10px 14px;font-weight:600}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:6px 10px;font-size:.85rem;border-radius:8px}
.btn.big{padding:15px 18px;font-size:1.08rem;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.pending{background:var(--warn-bg);color:var(--warn)}
.chip.approved{background:var(--ok-bg);color:var(--ok)}
.chip.rejected{background:var(--bad-bg);color:var(--bad)}
.chip.line{background:transparent;border:1px solid var(--line);color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1}
.stat span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
label.f,.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);font-weight:500;min-width:0}
label.f input,label.f select,label.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px;font-size:1rem;color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sizes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sizebox{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:8px 10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.sizebox .top{display:flex;justify-content:space-between;align-items:baseline;gap:4px;font-size:.85rem}
.sizebox input{border:0;background:transparent;font-size:1.35rem;font-family:var(--display);font-weight:700;width:100%;padding:2px 0;color:var(--ink)}
.sizebox input:focus{outline:none}
.sizebox:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.sizebox.full{opacity:.45}
.sizebox.over{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.prog{display:grid;grid-template-columns:104px 1fr auto;gap:8px;align-items:center;font-size:.85rem}
.bar{height:9px;border-radius:5px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ink)}
.bar i.p{background:repeating-linear-gradient(45deg,var(--accent) 0 4px,transparent 4px 7px)}
.picker{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:2px dashed var(--line);background:var(--surface);border-radius:var(--r);padding:14px;min-height:64px;color:var(--ink);width:100%;font-size:1rem}
.picker.set{border-style:solid;border-color:var(--ink)}
.picker>span:first-child{min-width:0}
.lotcard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink)}
.lotcard.dim{opacity:.55}
.lotcard .sz{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.left{font-family:var(--display);font-weight:700;font-size:1.3rem;text-align:right;line-height:1.1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);align-self:flex-start}
.seg button{border:0;background:transparent;padding:8px 14px;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--btn);color:var(--btn-ink)}
.search{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-size:1rem;width:100%;color:var(--ink)}
.entry{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:start}
.qty{font-family:var(--display);font-size:1.35rem;font-weight:700;text-align:right;line-height:1.1}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.person{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:14px 12px;text-align:left;color:var(--ink)}
.person b{display:block;font-size:1.02rem}
.empty{text-align:center;padding:26px 16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:6px}
.sheet-bg{position:fixed;inset:0;background:rgba(10,14,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;height:94%;overflow-y:auto;border-radius:16px 16px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet.short{height:auto;max-height:94%}
.sheet .shead{position:sticky;top:0;margin-inline:-16px;padding:14px 16px;background:var(--bg);z-index:1;border-bottom:1px solid var(--line)}
.hint{background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.85rem}
.warn{color:var(--warn)}
.err{color:var(--bad);font-size:.85rem}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btn-ink);padding:10px 16px;border-radius:10px;z-index:30;font-weight:500;max-width:calc(100% - 32px)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;background:var(--sunk)}
.crows{display:flex;flex-direction:column;gap:6px}
.crow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cname{font-weight:600;font-size:.85rem;min-width:64px}
.chip.zero{opacity:.45}
.colchips{display:flex;gap:8px;flex-wrap:wrap}
.colchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:600;color:var(--ink)}
.colchip.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.cblock{display:flex;flex-direction:column;gap:8px}
.cblock+.cblock{border-top:1px solid var(--line);padding-top:12px}
.applyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.applyrow input{width:76px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 9px;font-size:1rem;color:var(--ink)}
.qc{display:grid;grid-template-columns:44px 40px 1fr 1fr 44px;gap:6px 8px;align-items:center}
.qc .qh{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.qc input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px;font-size:1.05rem;color:var(--ink)}
.qc .ok{font-family:var(--display);font-size:1.2rem;text-align:right;color:var(--ok)}
.qc .ok.neg{color:var(--bad)}
table.split{min-width:0}
table.split th,table.split td{padding:6px 8px}
table.split input{width:64px;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px;font-size:1rem;color:var(--ink)}
.chip.pick{cursor:pointer;font-size:.85rem;padding:5px 10px}
.chip.pick.on{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.linkish{border:0;background:transparent;padding:0;text-align:left;color:var(--ink);text-decoration:underline dotted;text-underline-offset:3px;cursor:pointer}
.selcard{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.subbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border-radius:10px;padding:10px 12px}
.task.done{opacity:.5;background:var(--sunk)}
.task.done > .row > div > b:first-child{text-decoration:line-through;text-decoration-thickness:1px}
.ph-chip{color:var(--ink)}
.chip.ph-st{background:var(--yel);color:var(--yel-ink);border-color:transparent}
.chip.ph-qc{background:var(--grn);color:var(--grn-ink);border-color:transparent}
.chip.ph-wh{background:var(--gry);color:var(--gry-ink);border-color:transparent}
.phbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.phbar i{display:block;height:100%}.phbar i.ph-st{background:#E2B93B}.phbar i.ph-qc{background:#3FA36B}.phbar i.ph-wh{background:#A3A9B5}
.lotph-stitch{border-left:5px solid #E2B93B}.lotph-qc{border-left:5px solid #3FA36B}.lotph-wh{opacity:.6;background:var(--sunk)}
.tl{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:2px}
.tl li::marker{color:var(--muted)}
.erow{display:flex;justify-content:space-between;align-items:center;gap:8px;border-top:1px solid var(--line);padding-top:7px;font-size:.85rem;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

<div id="app"><div class="wrap" style="padding-block:40px"><div class="empty"><h3>Opening the register…</h3>Connecting to the factory's shared records.</div></div></div>

<script>
(function(){
/* ---------- constants ---------- */
const STAGES=[
  {k:'cutting',n:'Cutting',role:'Cutting master'},
  {k:'stitching',n:'Stitching',role:'Stitcher'},
  {k:'thread',n:'Thread cutting',role:'Thread cutter'},
  {k:'ironing',n:'Ironing',role:'Ironing'}];
const ROLES=['Cutting master','Stitcher','Thread cutter','Ironing','Lot allocator','Lot receiver','Checker','Warehouse receiver','Manager'];
const STAGE_BY_ROLE=Object.fromEntries(STAGES.map(s=>[s.role,s.k]));
const stageName=k=>(STAGES.find(s=>s.k===k)||{n:k}).n;
const SIZE_ORDER=['XS','S','M','L','XL','XXL','3XL','4XL'];
const ICON={
  add:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  lots:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4M3 17l9 4 9-4"/></svg>',
  done:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 15l3 3 5-6"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M18 14.8c1.9.8 3.1 2.6 3.5 5.2"/></svg>'};

const S={db:null,owner:false,loaded:false,cfg:null,catalog:{},lots:{},tasks:{},work:{},session:null,tab:'add',month:ym(new Date())};

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function prevMonth(m){let [y,mo]=m.split('-').map(Number);mo--;if(!mo){mo=12;y--}return y+'-'+pad(mo)}
function daysIn(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
function monthLabel(m){const [y,mo]=m.split('-');return ['January','February','March','April','May','June','July','August','September','October','November','December'][+mo-1]+' '+y}
function fmtDT(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d))return fmtDate(String(iso).slice(0,10));const h=d.getHours(),mi=pad(d.getMinutes());return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+', '+((h%12)||12)+':'+mi+' '+(h<12?'AM':'PM')}
/* time between two moments, e.g. "2 h 15 min" or "1 day 3 h" */
function dur(a,b){const ms=new Date(b)-new Date(a);if(!(ms>=0))return '—';const m=Math.round(ms/60000);if(m<1)return 'under 1 min';if(m<60)return m+' min';const h=Math.floor(m/60),mm=m%60;if(h<24)return h+' h'+(mm?' '+mm+' min':'');const d=Math.floor(h/24),hh=h%24;return d+(d>1?' days':' day')+(hh?' '+hh+' h':'')}
function fmtDate(d){if(!d)return '';const [,m,dd]=d.split('-');return +dd+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function inr(n){n=+n||0;return '₹'+(Math.abs(n)<100&&n%1?n.toLocaleString('en-IN',{maximumFractionDigits:2}):Math.round(n).toLocaleString('en-IN'))}
function hashPin(wid,pin){let h=5381;const s=wid+':'+pin;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function $(sel,root){return (root||document).querySelector(sel)}
function sortSizes(arr){return arr.slice().sort((a,b)=>(SIZE_ORDER.indexOf(a)+1||99)-(SIZE_ORDER.indexOf(b)+1||99))}
function toast(msg){document.querySelectorAll('.toast').forEach(t=>t.remove());const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function writeErr(e){console.error(e);if(e&&e.code==='invalid_argument')toast("Couldn't save. This account can only view. Ask the owner to share the page with you as Contributor.");else if(e&&e.code==='quota_exceeded')toast('Storage is full.');else toast("Couldn't save. Check the connection and try again.")}

const cfg=()=>S.cfg||{workers:{}};
const workers=()=>Object.entries(cfg().workers||{}).map(([id,w])=>({id,...w}));
const activeWorkers=()=>workers().filter(w=>w.active!==false).sort((a,b)=>ROLES.indexOf(a.role)-ROLES.indexOf(b.role)||a.name.localeCompare(b.name));
const W=id=>(cfg().workers||{})[id];
function me(){if(!S.session)return null;if(S.session.owner)return {id:'owner',name:'Owner',role:'Owner'};const w=W(S.session.wid);return w&&w.active!==false?{id:S.session.wid,...w}:null}
function myStage(){const m=me();return m?STAGE_BY_ROLE[m.role]||null:null}

/* designs: the Uniware list plus any added in the app */
function allDesigns(){const out={};for(const [doc,cat] of Object.entries(S.catalog).sort((a,b)=>a[0]==='manual'?1:b[0]==='manual'?-1:0)){for(const [code,d] of Object.entries(cat.designs||{})){if(!d||d.removed||out[code])continue;out[code]={...d,code,doc}}}return out}
function designRates(d){const out={};STAGES.forEach(s=>{const r=d&&d.r&&d.r[s.k];out[s.k]=r!=null&&r!==''?+r:null});return out}

/* ---------- lot progress ----------
   lot.prog[stage][entryId] = {w, q, sz:{S:10,...}, st:'pending'|'approved'|'rejected'|'withdrawn'}
   Each entry a worker saves is mirrored on the lot, so "pieces left" is right for everyone. */
function stageEntries(lot,stage){return Object.entries(((lot.prog||{})[stage])||{}).map(([eid,v])=>({eid,...v})).filter(v=>v&&v.st!=='rejected'&&v.st!=='withdrawn')}
function stageDone(lot,stage){const out={total:0,approved:0,pending:0,sz:{}};for(const v of stageEntries(lot,stage)){const q=+v.q||0;out.total+=q;if(v.st==='approved')out.approved+=q;else out.pending+=q;for(const [s,n] of Object.entries(v.sz||{}))out.sz[s]=(out.sz[s]||0)+(+n||0);for(const [s,n] of Object.entries(v.rejSz||{}))out.sz[s]=(out.sz[s]||0)+(+n||0)}return out}
function stageDoneBy(lot,stage,wid){return stageEntries(lot,stage).filter(v=>v.w===wid).reduce((a,v)=>a+(+v.q||0),0)}
/* a lot holds pieces per colour and size: lot.cells["Green|M"]=30 */
const CK=(c,sz)=>c+'|'+sz;
function splitCK(k){const i=k.lastIndexOf('|');return i<0?['',k]:[k.slice(0,i),k.slice(i+1)]}
function safeId(k){return k.replace(/[^A-Za-z0-9]/g,'_')}
function lotCells(l){if(l.cells)return l.cells;const o={};for(const [z,q] of Object.entries(l.sizeQty||{}))o[CK(l.colour||'',z)]=q;return o}
function lotColours(l){if(l.colours)return l.colours;return [l.colour||'']}
function stageLeft(lot,stage){const d=stageDone(lot,stage);const left={};let total=0;for(const [k,q] of Object.entries(lotCells(lot))){left[k]=Math.max(0,(+q||0)-(d.sz[k]||0));total+=left[k]}return {left,total}}
/* allocation: lot.recv[stage][rid] = {w, sz:{"Green|M":20}, q, date, by, st:'allocated'|'in'|'returned'}
   The lot allocator gives pieces to a stitcher (allocated), the stitcher receives them (in),
   submits finished pieces (prog st:'pending'), and the lot receiver & checker accepts them (st:'approved'). */
const RECV_STAGES=['stitching'];
function recvList(lot,stage){return Object.entries(((lot.recv||{})[stage])||{}).map(([rid,v])=>({rid,...v})).filter(v=>v&&v.st!=='returned')}
function nz(sz){const o={};for(const [k,n] of Object.entries(sz||{}))if(+n>0)o[k]=n;return o}
function doneCells(list){const o={};for(const v of list){for(const [k,n] of Object.entries(v.sz||{}))o[k]=(o[k]||0)+(+n||0);for(const [k,n] of Object.entries(v.rejSz||{}))o[k]=(o[k]||0)+(+n||0)}return o}
function sumCells(list){const o={};for(const v of list)for(const [k,n] of Object.entries(v.sz||{}))o[k]=(o[k]||0)+(+n||0);return o}
function toReceive(lot,stage){const got=sumCells(recvList(lot,stage));const left={};let total=0;for(const [k,q] of Object.entries(lotCells(lot))){left[k]=Math.max(0,(+q||0)-(got[k]||0));total+=left[k]}return {left,total}}
/* pieces the checker sent back that the stitcher has not received yet */
function altCells(v){if(v.altRecv)return {};if(v.st==='approved')return nz(v.altSz||{});if(v.st==='rejected'&&v.back==='checker')return nz(v.sz||{});return {}}
function altWaiting(lot,wid){const o={};let t=0;for(const v of Object.values(((lot.prog||{}).stitching)||{})){if(!v||v.w!==wid)continue;for(const [k,n] of Object.entries(altCells(v))){o[k]=(o[k]||0)+(+n||0);t+=+n||0}}return {cells:o,total:t}}
function myOpen(lot,stage,wid){const got=sumCells(recvList(lot,stage).filter(v=>v.w===wid));const done=doneCells(stageEntries(lot,stage).filter(v=>v.w===wid));const aw=stage==='stitching'?altWaiting(lot,wid).cells:{};for(const [k,n] of Object.entries(aw))done[k]=(done[k]||0)+n;const left={};let total=0,rec=0,fin=0;for(const k of Object.keys(lotCells(lot))){left[k]=Math.max(0,(got[k]||0)-(done[k]||0));total+=left[k];rec+=got[k]||0;fin+=done[k]||0}return {left,total,received:rec,done:fin}}
function lotLeft(lot,stage){const m=me();return RECV_STAGES.includes(stage)&&m?myOpen(lot,stage,m.id):stageLeft(lot,stage)}
function openRows(left){const by={};for(const [k,n] of Object.entries(left))if(n>0){const [c,z]=splitCK(k);(by[c]=by[c]||{})[z]=n}return `<div class="crows">${Object.entries(by).map(([c,zs])=>`<div class="crow">${c?`<span class="cname">${esc(c)}</span>`:''}<span class="row" style="gap:5px">${sortSizes(Object.keys(zs)).map(z=>`<span class="chip line">${esc(z)} <b>${zs[z]}</b></span>`).join('')}</span></div>`).join('')}</div>`}
function holders(lot,stage){const by={};for(const v of recvList(lot,stage))by[v.w]=(by[v.w]||0)+(+v.q||0);return by}
function colourTotal(lot,c){let t=0;for(const [k,q] of Object.entries(lotCells(lot)))if(splitCK(k)[0]===c)t+=+q||0;return t}
function fmtCells(sz){const by={};for(const [k,n] of Object.entries(sz||{})){const [c,z]=splitCK(k);(by[c]=by[c]||[]).push([z,n])}return Object.entries(by).map(([c,a])=>(c?esc(c)+': ':'')+sortSizes(a.map(x=>x[0])).map(z=>esc(z)+' '+a.find(x=>x[0]===z)[1]).join(', ')).join(' · ')}
function lotsSorted(){return Object.entries(S.lots).map(([id,l])=>({id,...l})).filter(l=>!l.deleted).sort((a,b)=>String(b.date||'').localeCompare(String(a.date||''))||String(b.createdAt||'').localeCompare(String(a.createdAt||'')))}
function lotLabel(l){const c=lotColours(l).filter(Boolean);return esc(l.design)+(c.length===1?'_'+esc(c[0]):c.length>1?' · '+c.length+' colours':'')}
function cellRows(l,left){const cells=lotCells(l);return `<div class="crows">${lotColours(l).map(c=>{const zs=sortSizes(Object.keys(cells).filter(k=>splitCK(k)[0]===c&&+cells[k]>0).map(k=>splitCK(k)[1]));if(!zs.length)return '';return `<div class="crow">${c?`<span class="cname">${esc(c)}</span>`:''}<span class="row" style="gap:5px">${zs.map(z=>{const k=CK(c,z);return `<span class="chip line ${left&&!left[k]?'zero':''}">${esc(z)} <b>${left?left[k]+'/':''}${cells[k]}</b></span>`}).join('')}</span></div>`}).join('')}</div>`}
/* when the pieces in this entry were allocated to the stitcher */
function allocFor(lot,e,wid){const rs=recvList(lot,'stitching').filter(v=>v.w===wid);if(e.rid){const r=rs.find(v=>v.rid===e.rid);if(r)return r.at||r.date}
  const keys=Object.keys(nz(e.sz));const hit=rs.filter(v=>keys.some(k=>(v.sz||{})[k])).sort((a,b)=>String(a.at||a.date).localeCompare(String(b.at||b.date)));return hit.length?(hit[0].at||hit[0].date):null}
function myEntries(wid,month){const d=S.work[wid+'_'+month];if(!d)return [];return Object.entries(d.entries||{}).map(([eid,e])=>({eid,docId:wid+'_'+month,...e})).filter(e=>e.status!=='withdrawn')}

/* ---------- writes ---------- */
async function upsert(path,body,init){const ref=S.db.doc(path);const snap=await ref.get();if(snap.exists)await ref.update(body);else await ref.set(Object.assign({},init||{},body))}

/* ---------- subscriptions ---------- */
let monthSubs=[],monthKey='';
function subscribeMonth(){
  monthSubs.forEach(u=>u());monthSubs=[];S.work={};
  const m=me();monthKey=m&&S.db?m.id+'@'+S.month:'';if(!m||m.id==='owner'||!S.db)return;
  for(const mo of [S.month,ym(new Date())].filter((x,i,a)=>a.indexOf(x)===i)){
    const key=m.id+'_'+mo;
    monthSubs.push(S.db.doc('work/'+key).onSnapshot(s=>{if(s.exists)S.work[key]=s.data();else delete S.work[key];schedule()},e=>console.warn(e)));
  }
}
function subscribeAll(){
  const err=e=>console.warn(e);
  S.db.doc('config/main').onSnapshot(s=>{S.cfg=s.exists?s.data():null;S.loaded=true;schedule()},err);
  S.db.collection('catalog').onSnapshot(q=>{const c={};q.docs.forEach(d=>c[d.id]=d.data());S.catalog=c;schedule()},err);
  S.db.collection('tasks').onSnapshot(q=>{const t={};q.docs.forEach(d=>t[d.id]=d.data());S.tasks=t;schedule()},err);
  S.db.collection('lots').onSnapshot(q=>{const l={};q.docs.forEach(d=>l[d.id]=d.data());S.lots=l;schedule()},err);
  subscribeMonth();
}
let raf=0;function schedule(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;render(true)})}

/* ---------- render ---------- */

    :m.role==='Warehouse receiver'?[['wh','Receive stock',ICON.add,nWh()],['stock','Stock',ICON.lots],['lots','All lots',ICON.done]]
    :m.role==='Checker'?[['inbox','Check work',ICON.done,nInbox()],['handover','Hand over',ICON.lots,lotsSorted().filter(l=>withChecker(l).total>0).length],['checked','Checked',ICON.team]]
    :m.role==='Thread cutter'?[['tnew','New lots',ICON.lots,lotsSorted().filter(l=>threadPool(l,m.id).total>0).length],['tdone','Completed',ICON.done]]
    :m.role==='Ironing'?[['inew','New lots',ICON.lots,flowItems('ironing').filter(v=>v.w===m.id&&v.st==='given').length],['idone','Completed',ICON.done]]
    :m.role==='Manager'?boss
    :RECV_STAGES.includes(myStage())?[['add','New lots',ICON.lots,myLots(m.id).reduce((n,l)=>n+allocOpen(l,m.id).filter(a=>a.total>0).length,0)],['alter','Alter / Rejected',ICON.add,myLots(m.id).reduce((a,l)=>a+altWaiting(l,m.id).total,0)],['done','Completed',ICON.done]]
    :myStage()?[['add','Add entry',ICON.add],['lots','Cut lots',ICON.lots],['done','Completed',ICON.done]]
    :[['lots','Cut lots',ICON.lots]];
  if(!tabs.find(t=>t[0]===S.tab))S.tab=tabs[0][0];

  for(const [id,v] of Object.entries(draft)){const el=document.getElementById(id);if(el&&el.closest('form')&&!el.disabled)el.value=v}
  const tot=keep&&($('[data-size]')||$('[data-csize]'));if(tot)tot.dispatchEvent(new Event('input',{bubbles:true}));
  window.scrollTo(sx,sy);

/* login */
function loginView(){
  const ws=activeWorkers();
  let h=`<div class="row spread"><h2>Who is working?</h2>${S.owner?`<button class="btn ${S.live?'alt':'accent'} sm" data-act="loginOwner">${S.live&&!(S.cfg&&S.cfg.ownerPin)?'Set up as owner':'Owner'}</button>`:''}</div>`;

}

/* ---- STITCHER: New lots (everything allocated to me that is not finished) ---- */
function myLots(wid){return lotsSorted().filter(l=>recvList(l,'stitching').some(v=>v.w===wid))}
function subState(l,wid){const e=stageEntries(l,'stitching').filter(v=>v.w===wid);const s=st=>e.filter(v=>v.st===st).reduce((a,v)=>a+(+v.q||0),0);const c=st=>fmtCells(nz(doneCells(e.filter(v=>v.st===st).map(v=>({sz:v.sz})))));return {pending:s('pending'),received:s('received'),ok:s('approved'),pendingC:c('pending'),receivedC:c('received'),okC:c('approved')}}
/* per-allocation view: pieces already submitted are matched to allocations oldest first,
   so a new allocation shows clean while leftover alter/short pieces stay on the allocation they came from */
function allocOpen(lot,wid){
  const st='stitching';const allocs=recvList(lot,st).filter(v=>v.w===wid).sort((a,b)=>String(a.at||a.date).localeCompare(String(b.at||b.date)));
  const done=doneCells(stageEntries(lot,st).filter(v=>v.w===wid));const aw=altWaiting(lot,wid).cells;
  const used={};for(const [k,n] of Object.entries(done))used[k]=n;for(const [k,n] of Object.entries(aw))used[k]=(used[k]||0)+n;
  return allocs.map(a=>{const left={};let total=0,touched=0;for(const [k,q] of Object.entries(a.sz||{})){const take=Math.min(+q||0,used[k]||0);used[k]=(used[k]||0)-take;left[k]=(+q||0)-take;total+=left[k];touched+=take}
    return {...a,left,total,touched}});
}
function stitchNewView(todays){
  const m=me();const cards=[];
  for(const l of myLots(m.id))for(const a of allocOpen(l,m.id))if(a.total>0)cards.push({lot:l,a});
  const tot=cards.reduce((s,c)=>s+c.a.total,0);
  let h=`<div class="row spread"><h2>New lots</h2><span class="small muted">${tot} pcs in hand</span></div>`;
  if(!cards.length)h+=`<div class="empty"><h3>No lot in hand</h3>Lots the lot allocator gives you appear here.</div>`;
  h+=cards.map(({lot:l,a})=>{const by=W(a.by);const isAlt=a.touched>0;
    return `<div class="card list" style="gap:8px">
    <div class="row spread" style="align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><span class="lotno" style="font-size:1.2rem">${esc(l.lotNo)}</span> <span class="muted">${esc(l.design)}</span><div class="small muted ell">${isAlt?'':'given '+fmtDT(a.at||a.date)+(by?' by '+esc(by.name):'')+' · '}${l.designName?esc(l.designName):''}</div></div>
    <div><div class="left">${a.total}</div><div class="small muted" style="text-align:right;white-space:nowrap">to make</div></div></div>
    ${isAlt?`<div class="small"><span class="chip pending">Alter / short pieces</span> sent back to you from this lot</div>`:''}
    ${openRows(a.left)}
    ${l.rates&&l.rates.stitching!=null?`<div class="small muted">Stitching rate ${inr(l.rates.stitching)}/pc</div>`:''}
    <button class="btn accent" data-submitalloc="${l.id}|${a.rid}" style="align-self:flex-start">Completed – ready to submit ${a.total} pcs</button>
  </div>`}).join('');
  return h;
}
/* hand over what is still in hand for one allocation card; the lot receiver counts it */
async function submitAlloc(lid,rid){
  const m=me();const st='stitching';const lot=S.lots[lid];if(!lot)return 0;const a=allocOpen(lot,m.id).find(x=>x.rid===rid);if(!a||!a.total)return 0;
  const sz={};for(const [k,n] of Object.entries(a.left))if(n>0)sz[k]=n;
  const date=today();const eid=uid('e');const month=date.slice(0,7);const rate=lot.rates&&lot.rates[st]!=null?+lot.rates[st]:null;const now=new Date().toISOString();
  await upsert('work/'+m.id+'_'+month,{entries:{[eid]:{date,lotId:lid,stage:st,qty:a.total,sz,rej:0,note:a.touched?'alter/short pieces':'',status:'pending',rate,at:now,by:m.name,rid}}},{workerId:m.id,month});
  await S.db.doc('lots/'+lid).update({prog:{[st]:{[eid]:{w:m.id,q:a.total,sz,st:'pending',date,at:now,rid}}}});
  return a.total;
}

/* stitcher hands over everything still in hand for a lot; the lot receiver counts it */
async function submitAll(lid){
  const m=me();const st='stitching';const lot=S.lots[lid];if(!lot)return 0;const o=myOpen(lot,st,m.id);if(!o.total)return 0;
  const sz={};for(const [k,n] of Object.entries(o.left))if(n>0)sz[k]=n;
  const date=today();const eid=uid('e');const month=date.slice(0,7);const rate=lot.rates&&lot.rates[st]!=null?+lot.rates[st]:null;
  await upsert('work/'+m.id+'_'+month,{entries:{[eid]:{date,lotId:lid,stage:st,qty:o.total,sz,rej:0,note:'',status:'pending',rate,at:new Date().toISOString(),by:m.name}}},{workerId:m.id,month});
  await S.db.doc('lots/'+lid).update({prog:{[st]:{[eid]:{w:m.id,q:o.total,sz,st:'pending',date,at:new Date().toISOString()}}}});
  return o.total;
}
/* alter pieces the checker sent back and the stitcher has not resubmitted yet */
function myAlter(l,wid){const alt=Object.values(((l.prog||{}).stitching)||{}).filter(v=>v&&v.w===wid&&v.altRecv&&!v.altDone).reduce((a,v)=>a+(v.st==='rejected'?(+v.q||0):(+v.alt||0)),0);const open=myOpen(l,'stitching',wid).total;return Math.min(alt,open)}
/* an alter/short entry is cleared once its pieces are back, resubmitted and passed:
   nothing waiting to be received, nothing left in hand for those sizes, nothing with the receiver or checker */
function alterResolved(l,v,wid){
  if(Object.keys(altCells(v)).length)return false;
  const keys=new Set([...Object.keys(nz(v.sz)),...Object.keys(nz(v.altSz)),...Object.keys(nz(v.rejSz))]);
  const open=myOpen(l,'stitching',wid).left;if([...keys].some(k=>(open[k]||0)>0))return false;
  const busy=Object.values(((l.prog||{}).stitching)||{}).some(e=>e&&e.w===wid&&(e.st==='pending'||e.st==='received')&&Object.keys(nz(e.sz)).some(k=>keys.has(k)));
  return !busy;
}
function alterView(){
  const m=me();const list=[];
  for(const l of lotsSorted())for(const [eid,v] of Object.entries(((l.prog||{}).stitching)||{}))if(v&&v.w===m.id&&((v.st==='approved'&&((+v.alt||0)+(+v.rej||0)>0))||v.st==='rejected'||(+v.short||0)>0)&&!alterResolved(l,v,m.id))list.push({lot:l,eid,...v});
  list.sort((a,b)=>String(b.at2||b.rat||'').localeCompare(String(a.at2||a.rat||'')));
  let h=`<div><h2>Alter / Rejected</h2><p class="small muted" style="margin:4px 0 0">Pieces the lot receiver found short, and pieces the checker marked alter or reject. Tap Receive when the alter pieces come back to you. They then show in New lots to submit again.</p></div>`;
  if(!list.length)return h+`<div class="empty"><h3>Nothing sent back</h3>When the checker marks pieces alter or reject, they show here.</div>`;
  return h+list.map(s=>{const l=s.lot;const open=myOpen(l,'stitching',m.id).total;const ck=W(s.by2);
    const allBack=s.st==='rejected';
    return `<div class="card list" style="gap:8px">
      <div class="row spread" style="align-items:flex-start;flex-wrap:nowrap"><div style="min-width:0"><span class="lotno" style="font-size:1.15rem">${esc(l.lotNo)}</span> <span class="muted">${lotLabel(l)}</span><div class="small muted">submitted ${fmtDT(s.at||s.date)}${s.at2?' · checked '+fmtDT(s.at2):''}${ck?' by '+esc(ck.name):''}</div></div>
      ${s.st==='approved'?`<div style="text-align:right"><div class="left">${s.q}</div><div class="small muted">passed</div></div>`:''}</div>
      ${allBack?`<div class="small"><span class="chip rejected">${s.back==='checker'?'All alter':'Not received by lot receiver'}</span> ${s.q} pcs ${s.back==='checker'?'to redo':'still with you'}</div>`:''}
      ${+s.short?`<div class="small"><span class="chip pending">Short ${s.short}</span> not handed over at receiving</div>`:''}
      ${+s.alt&&!allBack?`<div class="list" style="gap:4px"><span class="small"><span class="chip pending">Alter ${s.alt}</span> fix and submit again</span>${s.altSz?`<div class="small muted">${fmtCells(nz(s.altSz))}</div>`:''}</div>`:''}
      ${+s.rej?`<div class="list" style="gap:4px"><span class="small"><span class="chip rejected">Rejected ${s.rej}</span> not paid</span>${s.rejSz?`<div class="small muted">${fmtCells(nz(s.rejSz))}</div>`:''}</div>`:''}
      ${s.chkNote||s.rNote?`<div class="small">Note: ${esc(s.chkNote||s.rNote)}</div>`:''}
      ${(()=>{const ac=altCells(s);const n=Object.values(ac).reduce((a,b)=>a+(+b||0),0);if(n)return `<button class="btn accent" data-recvalt="${l.id}|${s.eid}" style="align-self:flex-start">Receive ${n} alter pcs</button>`;if(s.altRecv)return `<div class="small"><span class="chip approved">Received ${fmtDT(s.altRat)}</span> Fix them and submit from <b>New lots</b>.</div>`;return ''})()}
    </div>`}).join('');
}

    if(b.id==='aGo'){
      const err=x=>{$('#rErr',sh).textContent=x};const m=me();const cur={id:lid,...S.lots[lid]};const now=toReceive(cur,'stitching');const date=today();const at=new Date().toISOString();

      if(mode==='whole'){const wid=$('#aW',sh).value;if(!wid)return err('Select the stitcher.');const sz={};for(const k of keys()){if((now.left[k]||0)<tr.left[k]){const [c,z]=splitCK(k);return err(`${c} ${z}: someone just allocated some of these pieces. Close and open again.`)}sz[k]=tr.left[k]}give[wid]=sz}
      else{if(!picked.length)return err('Tap the stitchers who will share this sub-lot.');const {per,bad}=readSplit();if(bad)return err(bad);

/* checker can correct a passed check while the stitcher has not taken the alter back

async function decide(lid,eid,status,sz,q,note,qc){
  const l=S.lots[lid];const s=l.prog.stitching[eid];const m=me();const now=new Date().toISOString();const diff=Math.max(0,(+s.q||0)-(q||0));
  const fullSz={};Object.keys(s.sz||{}).forEach(k=>fullSz[k]=sz?(sz[k]||0):s.sz[k]);
  let lotPatch,entPatch;
  if(status==='received'){
    lotPatch={st:'received',q,sz:fullSz,rq:q,short:diff,rby:m.id,rat:now,rNote:note||''};
    entPatch={status:'received',qty:q,sz:fullSz,submitted:s.q,short:diff,receivedBy:m.name,receivedAt:now,receiveNote:note||''};
  }else if(status==='approved'){
    lotPatch={st:'approved',q,sz:fullSz,altSz:qc.altSz,rejSz:qc.rejSz,alt:qc.alt,rej:qc.rej,by2:m.id,at2:now,chkNote:note||''};
    entPatch={status:'approved',qty:q,sz:fullSz,alter:qc.alt,reject:qc.rej,altSz:qc.altSz,rejSz:qc.rejSz,decidedBy:m.name,decidedAt:now,checkNote:note||''};
  }else{
    lotPatch={st:'rejected',by2:m.id,at2:now,alt:s.q,chkNote:note||'',back:s.st==='received'?'checker':'receiver'};if(s.st!=='received'){lotPatch.rby=m.id;lotPatch.rat=now}
    entPatch={status:'rejected',decidedBy:m.name,decidedAt:now,alter:s.q,checkNote:note||''};
  }
  await S.db.doc('lots/'+lid).update({prog:{stitching:{[eid]:lotPatch}}});
  try{await S.db.doc('work/'+s.w+'_'+String(s.date).slice(0,7)).update({entries:{[eid]:entPatch}})}catch(x){console.warn('work doc',x)}
}

/* ---- AFTER CHECKING: checker -> thread cutter -> ironing -> warehouse ----
   lot.flow[fid] = {stage:'thread'|'ironing', w, sz, q, by, at, st:'given'|'done', doneAt, wh:{...}} */
const FLOW_NEXT={thread:'ironing',ironing:'warehouse'};
function flowItems(stage){const out=[];for(const l of lotsSorted())for(const [fid,v] of Object.entries(l.flow||{}))if(v&&v.st!=='cancelled'&&(!stage||v.stage===stage))out.push({lot:l,fid,...v});return out}
/* passed stitching pieces still with the checker (not handed to a thread cutter yet) */
function passedCells(l){const o={};for(const v of Object.values(((l.prog||{}).stitching)||{})){if(!v||v.st!=='approved'||v.wh)continue;for(const [k,n] of Object.entries(v.sz||{}))o[k]=(o[k]||0)+(+n||0)}return o}
function handedCells(l){const o={};for(const v of Object.values(l.flow||{})){if(!v||v.stage!=='thread'||v.st==='cancelled')continue;for(const [k,n] of Object.entries(v.sz||{}))o[k]=(o[k]||0)+(+n||0)}return o}
function withChecker(l){const p=passedCells(l),h=handedCells(l);const left={};let total=0;for(const [k,n] of Object.entries(p)){const x=Math.max(0,n-(h[k]||0));if(x){left[k]=x;total+=x}}return {left,total}}
let hoSel={lid:null,keys:new Set()};
/* thread cutter: pieces received from the checker minus pieces already handed to ironing */
function threadPool(l,wid){const g={},o={};for(const v of Object.values(l.flow||{})){if(!v||v.st==='cancelled')continue;
  if(v.stage==='thread'&&v.w===wid)for(const [k,n] of Object.entries(v.sz||{}))g[k]=(g[k]||0)+(+n||0);
  if(v.stage==='ironing'&&v.fromW===wid)for(const [k,n] of Object.entries(v.sz||{}))o[k]=(o[k]||0)+(+n||0)}
  const left={};let total=0;for(const [k,n] of Object.entries(g)){const x=Math.max(0,n-(o[k]||0));if(x){left[k]=x;total+=x}}return {left,total}}
let tSel={lid:null,wid:null,keys:new Set()};
function threadNewView(){
  const m=me();const ls=lotsSorted().filter(l=>threadPool(l,m.id).total>0);const tot=ls.reduce((a,l)=>a+threadPool(l,m.id).total,0);
  let h=`<div class="row spread"><h2>New lots</h2><span class="small muted">${tot} pcs in hand</span></div>`;
  if(!ls.length)return h+`<div class="empty"><h3>No lot in hand</h3>Lots the checker hands over to you appear here.</div>`;
  return h+`<p class="small muted" style="margin:0">Tap the sizes (or a colour) you have finished, then hand them over to ironing.</p><div class="list" id="tList">${threadListHtml()}</div>`;
}
/* manager: hand over to ironing on behalf of any thread cutter */
function mgrThreadView(){

  let h=`<div class="row spread"><h2>Thread cutter → ironing</h2><span class="small muted">${tot} pcs with thread cutters</span></div><p class="small muted" style="margin:0">Hand over finished pieces to ironing for any thread cutter. Tap sizes (or a colour) to choose.</p>`;
  if(!tot)return h+`<div class="empty"><h3>Nothing with thread cutters</h3>Pieces handed over by the checker show here.</div>`;

function mgrThreadListHtml(){return activeWorkers().filter(w=>w.role==='Thread cutter').map(w=>threadListHtml(w.id)).join('')||`<div class="empty">Nothing with thread cutters.</div>`}
function threadListHtml(forWid){
  const m=forWid?{id:forWid}:me();return lotsSorted().filter(l=>threadPool(l,m.id).total>0).map(l=>{const pl=threadPool(l,m.id);const mine=tSel.lid===l.id&&tSel.wid===m.id;const n=mine?[...tSel.keys].reduce((a,k)=>a+(pl.left[k]||0),0):0;
    const from=Object.values(l.flow||{}).filter(v=>v&&v.stage==='thread'&&v.w===m.id).map(v=>W(v.by)).filter(Boolean).map(w=>w.name).filter((x,i,a)=>a.indexOf(x)===i).join(', ');
    const by={};Object.keys(pl.left).forEach(k=>{const [c]=splitCK(k);(by[c]=by[c]||[]).push(k)});

/* ---- MANAGER / OWNER: who has which pending task ---- */
function pendingByPerson(){
  const rows=[];const lots=lotsSorted();
  const lotPcs=(pairs)=>pairs.filter(x=>x.q>0);
  const shared=(label,pairs,unit)=>({label,pairs:lotPcs(pairs),unit});
  // queues shared by everyone in a role
  const alloc=lots.map(l=>({lot:l,q:toReceive(l,'stitching').total}));
  const rcv=submissions('pending').map(s=>({lot:s.lot,q:+s.q||0,who:s.w}));
  const chk=submissions('received').map(s=>({lot:s.lot,q:+s.q||0,who:s.w}));
  const hand=lots.map(l=>({lot:l,q:withChecker(l).total}));
  const wh=whPending().map(v=>({lot:v.lot,q:+v.q||0,who:v.w}));
  for(const w of activeWorkers()){
    const tasks=[];
    if(w.role==='Stitcher'){
      const inHand=[],altW=[];for(const l of lots){const o=myOpen(l,'stitching',w.id).total;if(o)inHand.push({lot:l,q:o});const a=altWaiting(l,w.id).total;if(a)altW.push({lot:l,q:a})}
      const sub=submissions(['pending','received']).filter(s=>s.w===w.id).map(s=>({lot:s.lot,q:+s.q||0}));
      tasks.push(shared('To stitch',inHand),shared('Alter not received back',altW),shared('Submitted, not checked yet',sub));
    }
    if(w.role==='Lot allocator'||w.role==='Manager')tasks.push(shared('To allocate',alloc));
    if(w.role==='Lot receiver'||w.role==='Manager')tasks.push(shared('To receive from stitchers',rcv));
    if(w.role==='Checker'||w.role==='Manager'){tasks.push(shared('To check',chk));tasks.push(shared('Passed, not handed to thread cutter',hand))}
    if(w.role==='Thread cutter')tasks.push(shared('Thread cutting in hand',lots.map(l=>({lot:l,q:threadPool(l,w.id).total}))));
    if(w.role==='Ironing')tasks.push(shared('Ironing in hand',flowItems('ironing').filter(v=>v.w===w.id&&v.st==='given').map(v=>({lot:v.lot,q:+v.q||0})))),tasks.push(shared('Sent, warehouse not counted',wh.filter(x=>x.who===w.id)));
    if(w.role==='Warehouse receiver')tasks.push(shared('To receive in warehouse',wh));
    const live=tasks.filter(t=>t.pairs.length);
    rows.push({w,tasks:live,total:live.reduce((a,t)=>a+t.pairs.reduce((b,x)=>b+x.q,0),0)});
  }
  return rows;
}
let pendRole='all';
function pendingView(){
  const rows=pendingByPerson();const roles=['all',...ROLES.filter(r=>rows.some(x=>x.w.role===r))];
  const shown=rows.filter(r=>pendRole==='all'||r.w.role===pendRole);
  const busy=shown.filter(r=>r.total>0).sort((a,b)=>b.total-a.total),free=shown.filter(r=>!r.total);
  let h=`<div class="row spread"><h2>Pending work</h2><span class="row" style="gap:6px"><button class="btn alt sm" data-tab="lots">All lots</button><button class="btn alt sm" data-tab="stock">Stock</button>${me().id==='owner'?'<button class="btn alt sm" data-tab="team">Team</button>':''}</span></div>
  <div class="small muted">${busy.length} people with work</div>`;
  h+=`<div class="colchips">${roles.map(r=>`<button type="button" class="colchip ${pendRole===r?'on':''}" data-prole="${esc(r)}">${r==='all'?'Everyone':esc(r)}</button>`).join('')}</div>`;
  if(!busy.length)h+=`<div class="empty"><h3>Nothing pending</h3>No one ${pendRole==='all'?'':'in this role '}has work waiting.</div>`;
  h+=busy.map(r=>`<div class="card list" style="gap:8px"><div class="row spread"><span><b style="font-size:1.05rem">${esc(r.w.name)}</b> <span class="small muted">${esc(r.w.role)}</span></span><b class="lotno" style="font-size:1.2rem">${r.total} pcs</b></div>
    ${r.tasks.map(t=>{const sum=t.pairs.reduce((a,x)=>a+x.q,0);const byLot={};t.pairs.forEach(x=>byLot[x.lot.lotNo+' '+x.lot.design]=(byLot[x.lot.lotNo+' '+x.lot.design]||0)+x.q);
      return `<div class="list" style="gap:4px;border-top:1px solid var(--line);padding-top:6px"><div class="row spread small"><span class="chip ${/alter|not/i.test(t.label)?'pending':'line'}">${esc(t.label)}</span><b>${sum} pcs</b></div><div class="small muted">${Object.entries(byLot).map(([k,q])=>`<span style="white-space:nowrap">${esc(k)} · <b>${q}</b></span>`).join(' &nbsp;|&nbsp; ')}</div></div>`}).join('')}
  </div>`).join('');
  if(free.length)h+=`<p class="small muted" style="margin:0">Nothing pending: ${free.map(r=>esc(r.w.name)).join(', ')}</p>`;
  return h;

/* ---- TASKS: owner / manager assign work to the cutting master ----

/* where each colour/size of a lot is right now */
function lotPhases(l){
  const cells=lotCells(l);const add=(o,sz,sign)=>{for(const [k,n] of Object.entries(sz||{}))o[k]=(o[k]||0)+sign*(+n||0)};
  const na=toReceive(l,'stitching').left;const st={},qc={},wh={},rej={};
  for(const w of Object.keys(holders(l,'stitching'))){add(st,myOpen(l,'stitching',w).left,1);add(st,altWaiting(l,w).cells,1)}
  for(const v of Object.values(((l.prog||{}).stitching)||{})){if(!v)continue;if(v.st==='pending'||v.st==='received')add(qc,v.sz,1);if(v.st==='approved'){add(qc,v.sz,1);add(rej,v.rejSz,1);if(v.wh)add(wh,v.wh.sz,1)}}
  for(const v of Object.values(l.flow||{}))if(v&&v.wh)add(wh,v.wh.sz,1);
  add(qc,wh,-1);
  const out={};const tot={na:0,st:0,qc:0,wh:0,rej:0};
  for(const k of Object.keys(cells)){const c={na:na[k]||0,st:Math.max(0,st[k]||0),qc:Math.max(0,qc[k]||0),wh:wh[k]||0,rej:rej[k]||0};out[k]=c;for(const x in tot)tot[x]+=c[x]}
  const state=tot.st?'stitch':tot.qc?'qc':tot.na?'new':'wh';
  return {cells:out,tot,state};
}
/* chip background split by share: yellow = with stitcher, green = checking to ironing, grey = warehouse, white = not allocated */
function phaseStyle(c,total){const segs=[['var(--yel)',c.st],['var(--grn)',c.qc],['var(--gry)',c.wh],['var(--surface)',c.na]].filter(x=>x[1]>0);const t=Math.max(1,total||segs.reduce((a,x)=>a+x[1],0));
  if(segs.length<=1)return segs.length?`background:${segs[0][0]};border-color:transparent`:'';let at=0;const stops=segs.map(([col,n])=>{const from=at/t*100;at+=n;const to=at/t*100;return `${col} ${from.toFixed(1)}% ${to.toFixed(1)}%`});
  return `background:linear-gradient(90deg,${stops.join(',')});border-color:var(--line)`}
function phaseClass(c){if(c.st)return 'ph-st';if(c.qc)return 'ph-qc';if(c.na)return '';if(c.wh)return 'ph-wh';return 'ph-wh'}

/* ---- COMPLETED: this month, 1–15 and 16–end ---- */
function doneView(){
  const m=me();const cur=ym(new Date());const dim=daysIn(S.month);
  const half=halfSel||(S.month===cur&&new Date().getDate()>15?2:1);
  const inHalf=d=>{const day=+String(d).slice(8);return half===1?day<=15:day>=16};
  const range=half===1?'1 – 15':'16 – '+dim;
  let h=`<div class="row spread"><h2>Completed</h2><div class="row" style="gap:6px"><button class="btn alt sm" data-month="-1" aria-label="Previous month">‹</button><b>${monthLabel(S.month)}</b><button class="btn alt sm" data-month="1" aria-label="Next month" ${S.month>=cur?'disabled':''}>›</button></div></div>`;
  h+=`<div class="seg">${[[1,'1 – 15'],[2,'16 – '+dim]].map(([k,n])=>`<button data-half="${k}" class="${half===k?'on':''}">${n}</button>`).join('')}</div>`;
  if(m.role==='Cutting master'){
    const lots=lotsSorted().filter(l=>l.cutBy===m.id&&String(l.date).slice(0,7)===S.month&&inHalf(l.date));
    const pcs=lots.reduce((a,l)=>a+(+l.total||0),0);const amt=lots.reduce((a,l)=>a+(l.rates&&l.rates.cutting!=null?l.total*l.rates.cutting:0),0);
    h+=`<div class="stats"><div class="stat"><span>Lots cut</span><b>${lots.length}</b></div><div class="stat"><span>Pieces</span><b>${pcs}</b></div><div class="stat"><span>Amount</span><b>${inr(amt)}</b></div></div>`;
    return h+(lots.length?`<div class="list">${lots.map(l=>lotCard(l,{})).join('')}</div>`:`<div class="empty">No lots cut on ${range} ${monthLabel(S.month)}.</div>`);
  }
  const list=myEntries(m.id,S.month).filter(e=>e.status!=='rejected'&&inHalf(e.date)).sort((a,b)=>b.date.localeCompare(a.date)||String(b.at).localeCompare(String(a.at)));
  const sum=arr=>arr.reduce((a,e)=>({pcs:a.pcs+(+e.qty||0),amt:a.amt+(e.rate!=null&&e.status==='approved'?e.qty*e.rate:0),appr:a.appr+(e.status==='approved'?+e.qty:0)}),{pcs:0,amt:0,appr:0});
  const t=sum(list);
  h+=`<div class="stats"><div class="stat"><span>Pieces</span><b>${t.pcs}</b></div><div class="stat"><span>Passed</span><b>${t.appr}</b></div><div class="stat"><span>Earned</span><b>${inr(t.amt)}</b></div></div>${t.pcs>t.appr?`<p class="small muted" style="margin:0">${t.pcs-t.appr} pcs are still with the lot receiver or checker. Amount is added once they pass.</p>`:''}`;
  if(!list.length)return h+`<div class="empty">No entries on ${range} ${monthLabel(S.month)}.</div>`;
  const groups={};
  for(const e of list){const tot=Object.values(nz(e.sz)).reduce((x,y)=>x+y,0)||1;
    for(const [k,n] of Object.entries(nz(e.sz))){const g=groups[e.lotId+'#'+k]||(groups[e.lotId+'#'+k]={lotId:e.lotId,k,subs:[]});g.subs.push({e,n,share:n/tot})}}
  const gl=Object.values(groups).map(g=>{g.subs.sort((x,y)=>String(x.e.at||x.e.date).localeCompare(String(y.e.at||y.e.date)));g.last=g.subs[g.subs.length-1].e.at||g.subs[g.subs.length-1].e.date;return g}).sort((x,y)=>String(y.last).localeCompare(String(x.last)));
  const stChip=e=>`<span class="chip ${e.status==='received'?'pending':e.status}">${e.status==='pending'?'Pending':e.status==='received'?'With checker':'Passed'}</span>`;
  h+=`<div class="list">${gl.map(g=>{const lot=S.lots[g.lotId]||{lotNo:'(lot removed)',design:''};const [c,z]=splitCK(g.k);
    const als=g.subs.map(x=>allocFor(lot,x.e,m.id)).filter(Boolean).sort();const al=als[0]||null;
    const pcs=g.subs.reduce((a,x)=>a+x.n,0);let amt=null;
    g.subs.forEach(x=>{const e=x.e;if(e.rate!=null&&e.status==='approved')amt=(amt||0)+Math.round(e.qty*e.rate*x.share)});
    const first=g.subs[0].e.at||g.subs[0].e.date;const lastE=g.subs[g.subs.length-1].e;
    const alt=g.subs.reduce((a,x)=>a+(+((x.e.altSz||{})[g.k]||0)),0),rej=g.subs.reduce((a,x)=>a+(+((x.e.rejSz||{})[g.k]||0)),0);
    return `<div class="card list" style="gap:8px">
      <div class="row spread" style="flex-wrap:nowrap;gap:8px"><b class="lotno" style="font-size:.9rem;min-width:0;overflow-wrap:break-word;letter-spacing:-.01em">${esc(lot.lotNo)}/${esc(lot.design||'')}/${esc(c)}/${esc(z)}</b><b style="white-space:nowrap;flex:none">× ${pcs}</b></div>
      <ul class="tl"><li>Allocated: <b>${al?fmtDT(al):'—'}</b></li><li>Submitted: <b>${fmtDT(first)}</b></li><li>Time taken: <b>${al?dur(al,first):'—'}</b></li></ul>
      <div class="row spread"><span class="row" style="gap:6px">${stChip(lastE)}${alt?`<span class="small warn">${alt} alter</span>`:''}${rej?`<span class="small" style="color:var(--bad)">${rej} rej</span>`:''}</span><span class="row" style="gap:6px">${amt!=null?`<b>${inr(amt)}</b>`:''}${lastE.status==='pending'?`<button class="btn alt sm" data-withdraw="${lastE.docId}|${lastE.eid}">Undo</button>`:''}</span></div>
    </div>`}).join('')}</div>`;
  return h;
}

/* ---------- own-server data layer (used when window.FFR_API is set) ---------- */
function serverDb(cfg){
  const cache={},subs=new Set();let since=0,busy=false,ready=false,want=false;const pend={};
  const clone=v=>v===undefined?undefined:JSON.parse(JSON.stringify(v));
  function mergeInto(a,b){for(const k in b){const v=b[k];if(v&&typeof v==='object'&&!Array.isArray(v)&&a[k]&&typeof a[k]==='object'&&!Array.isArray(a[k]))mergeInto(a[k],v);else a[k]=clone(v)}return a}
  async function call(body){
    let r;try{r=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({k:cfg.k},body)),cache:'no-store'})}catch(e){throw new Error('No connection to the server. Check the internet and try again.')}
    const t=await r.text();if(!r.ok||!t)throw new Error('The server did not accept this ('+r.status+'). Try again.');return JSON.parse(t)}
  function snap(p){const d=cache[p];return {id:p.split('/').pop(),exists:d!==undefined,data:()=>clone(d)}}
  function fire(changed){subs.forEach(f=>{try{f(changed)}catch(e){console.warn(e)}})}
  function net(ok){const was=document.documentElement.classList.contains('offline');document.documentElement.classList.toggle('offline',!ok);if(was!==!ok&&!ready)schedule()}
  async function sync(){if(busy)return;busy=true;try{const r=await call({op:'sync',since});const ch=new Set();
      for(const x of (r.docs||[])){if(+x.v>since)since=+x.v;if(pend[x.p])continue;const s=JSON.stringify(x.d);if(JSON.stringify(cache[x.p])!==s){cache[x.p]=x.d;ch.add(x.p)}}
      if(!ready){ready=true;fire(null)}else if(ch.size)fire(ch);net(true)}catch(e){net(false)}finally{busy=false;if(want){want=false;setTimeout(sync,0)}}}
  async function write(op,p,d){pend[p]=(pend[p]||0)+1;const before=clone(cache[p]);
    if(op==='set')cache[p]=clone(d);else cache[p]=mergeInto(cache[p]?clone(cache[p]):{},d);fire(new Set([p]));
    try{await call({op,path:p,data:d})}catch(e){if(before===undefined)delete cache[p];else cache[p]=before;fire(new Set([p]));throw e}finally{if(!--pend[p])delete pend[p]}
    if(busy)want=true;else sync()}
  let timer=null;function loop(){clearTimeout(timer);timer=setTimeout(async()=>{if(!document.hidden)await sync();loop()},4000)}
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});window.addEventListener('online',()=>sync());
  sync().then(loop);
  function doc(p){return {
    get:async()=>{const r=await call({op:'get',path:p});if(r.doc!=null)cache[p]=r.doc;return {id:p.split('/').pop(),exists:r.doc!=null,data:()=>clone(r.doc==null?undefined:r.doc)}},
    set:d=>write('set',p,d),update:d=>write('update',p,d),
    onSnapshot:(next)=>{const f=ch=>{if(!ready)return;if(ch===null||ch.has(p))next(snap(p))};subs.add(f);if(ready)setTimeout(()=>next(snap(p)),0);return()=>subs.delete(f)}}}
  function collection(c){return {onSnapshot:(next)=>{const pre=c+'/';const emit=()=>next({docs:Object.keys(cache).filter(k=>k.startsWith(pre)&&k.indexOf('/',pre.length)<0).map(snap)});
    const f=ch=>{if(!ready)return;if(ch===null||[...ch].some(k=>k.startsWith(pre)))emit()};subs.add(f);if(ready)setTimeout(emit,0);return()=>subs.delete(f)}}}
  return {doc,collection,ready:()=>ready,retry:()=>sync()};
}
/* ---------- boot ---------- */
S.session=store('ffr.session');
(async()=>{
  if(window.FFR_API){S.live=true;S.db=serverDb(window.FFR_API);S.owner=true}
  else{
  const db=(window.claude&&window.claude.use)?await window.claude.use('db').catch(()=>null):null;
  if(!db){S.loaded=true;render();return}
  S.db=db;
  try{const u=await window.claude.use('user');S.owner=u?!!(await u.isOwner()):false}catch(e){S.owner=false}
  if(S.session&&S.session.owner&&!S.owner)S.session=null;
  }
  subscribeAll();
  setTimeout(()=>{if(!S.loaded){S.loaded=true;render()}},6000);
})();
})();
